# Android APK 构建：手动触发或推送到 android 分支，产出可直装的 debug APK
#
# 用途：没有 PC 也能出包——手机上改代码 → push → 这里编译 → 下载 artifact。
# 放置位置：仓库根目录 .github/workflows/android.yml
name: android

on:
  push:
    branches: [android, main]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      # setup.sh 从固定官方地址拉 sherpa-onnx AAR + 语音模型（约 78 MB），
      # 并做 SHA-256 校验；缓存 models/ 与 app/libs 避免每次重下。
      - uses: actions/cache@v6
        with:
          path: |
            models
            app/libs
          key: android-deps-${{ hashFiles('setup.sh') }}

      - name: Fetch models and native libs
        run: ./setup.sh

      # 固定 debug 签名：CI 每次跑在新 runner 上，不固定则每次构建签名都不同，
      # 覆盖安装会失败（INSTALL_FAILED_UPDATE_INCOMPATIBLE），App 里的配置和 key 也会丢。
      # 做法：仓库根目录的 .ci/debug.keystore 缓存复用，缺了就生成一把（app/build.gradle.kts 会用它）。
      - name: Restore debug keystore
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.ci/debug.keystore
          key: debug-keystore-v2

      - name: Ensure debug keystore
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.ci"
          KS="$GITHUB_WORKSPACE/.ci/debug.keystore"
          if [ -f "$KS" ]; then
            echo "keystore: 已从缓存恢复（签名固定）"
          else
            keytool -genkeypair -v -keystore "$KS" -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10950 \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "keystore: 首次生成，构建结束后会缓存"
          fi
          keytool -list -keystore "$KS" -storepass android | tail -2

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # 仓库里已有 gradlew，直接用它（不要用系统 gradle，版本可能不匹配）
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: SimulSub-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      # ── 可选：要出签名 release 包时，在仓库 Secrets 配好下面四个再看这段 ──
      # - name: Sign release
      #   env:
      #     KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      #     KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      #     KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      #     KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      #   run: |
      #     ./gradlew :app:assembleRelease --no-daemon --stacktrace
      #     echo "$KEYSTORE_BASE64" | base64 -d > /tmp/release.jks
