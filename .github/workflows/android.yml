# Android APK 构建：手动触发或推送到 android 分支，产出可直装的 debug APK
#
# 用途：没有 PC 也能出包——手机上改代码 → push → 这里编译 → 下载 artifact。
# 放置位置：仓库根目录 .github/workflows/android.yml
name: android

on:
  push:
    branches: [android, main]
  workflow_dispatch:
    inputs:
      keep:
        description: "为这个版本单独留一份 APK（默认只更新滚动 release）"
        type: boolean
        default: false

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # 发布应用内更新需要写 release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      # versionCode 从 1000 起，避免和固定的 27 倒挂；App 内的更新器靠它判断「有新版本」。
      # 用 shell 算再写进 GITHUB_ENV（往 env: 里直接放表达式会让 workflow 校验不通过）。
      - name: Set version code
        run: echo "CI_VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      # setup.sh 从固定官方地址拉 sherpa-onnx AAR + 语音模型（约 78 MB），
      # 并做 SHA-256 校验；缓存 models/ 与 app/libs 避免每次重下。
      - uses: actions/cache@v6
        with:
          path: |
            models
            app/libs
          key: android-deps-${{ hashFiles('setup.sh') }}

      - name: Fetch models and native libs
        run: ./setup.sh

      # 固定 debug 签名：CI 每次跑在新 runner 上，不固定则每次构建签名都不同，
      # 覆盖安装会失败（INSTALL_FAILED_UPDATE_INCOMPATIBLE），App 里的配置和 key 也会丢。
      # 做法：仓库根目录的 .ci/debug.keystore 缓存复用，缺了就生成一把（app/build.gradle.kts 会用它）。
      - name: Restore debug keystore
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.ci/debug.keystore
          key: debug-keystore-v2

      - name: Ensure debug keystore
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.ci"
          KS="$GITHUB_WORKSPACE/.ci/debug.keystore"
          if [ -f "$KS" ]; then
            echo "keystore: 已从缓存恢复（签名固定）"
          else
            keytool -genkeypair -v -keystore "$KS" -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10950 \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "keystore: 首次生成，构建结束后会缓存"
          fi
          keytool -list -keystore "$KS" -storepass android | tail -2

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # 仓库里已有 gradlew，直接用它（不要用系统 gradle，版本可能不匹配）
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: SimulSub-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      # 应用内更新：发一个滚动的 release（tag 固定 diy-latest），APK 和 update.json 每次覆盖。
      # App 读 releases/latest/download/update.json，比对 versionCode，下载后校验 size + sha256 再装。
      - name: Publish in-app update release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          echo "APK: $APK"
          SIZE=$(stat -c%s "$APK")
          SHA=$(sha256sum "$APK" | awk '{print $1}')
          NAME="1.0.7-diy.$CI_VERSION_CODE"
          MB=$(( SIZE / 1048576 ))
          MSG=$(git log -1 --pretty=%s | tr -d '"')
          BODY=$(git log -1 --pretty=%b | sed '/^$/d' | head -6 | tr -d '"')
          printf '{"versionCode":%s,"versionName":"%s","notes":"%s","apkUrl":"https://github.com/%s/releases/latest/download/app-debug.apk","size":%s,"sha256":"%s"}\n' \
            "$CI_VERSION_CODE" "$NAME" "$MSG" "$GITHUB_REPOSITORY" "$SIZE" "$SHA" > update.json
          cat update.json
          gh release view diy-latest >/dev/null 2>&1 \
            || gh release create diy-latest --title "最新构建" --notes "首次创建" --latest
          gh release upload diy-latest "$APK#app-debug.apk" update.json --clobber
          # 把 diy-latest 移到这次提交：否则 release 页显示的 commit 还停在第一次创建时
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/diy-latest" -f "sha=$GITHUB_SHA" -F "force=true" >/dev/null
          {
            echo "**最新版本：$NAME**（versionCode $CI_VERSION_CODE，构建 #$CI_VERSION_CODE）"
            echo ""
            echo "### 本版更新内容"
            echo ""
            echo "$MSG"
            if [ -n "$BODY" ]; then
              echo ""
              echo '```'
              echo "$BODY"
              echo '```'
            fi
            echo ""
            echo "### 下载"
            echo ""
            echo "下面的 Assets 里就是安装包：安卓取 \`app-debug.apk\`，Windows 取 \`Windows-SimulSub-x64.zip\`（解压后双击 \`SimulSub.exe\`）。"
            echo ""
            echo "### 校验"
            echo ""
            echo '```'
            echo "size   = $SIZE"
            echo "sha256 = $SHA"
            echo "commit = $GITHUB_SHA"
            echo '```'
            echo ""
            echo "每个版本的改动见 [CHANGELOG.md](https://github.com/$GITHUB_REPOSITORY/blob/main/CHANGELOG.md)。"
          } > notes.md
          gh release edit diy-latest --title "$NAME" --notes-file notes.md --latest

      # 每个版本都打 tag（只占几个字节，方便 checkout 出当时的代码）；
      # 但 APK 只在明确要求时才单独存一份——提交信息带 [keep]，或手动运行并勾选「保留」。
      # 平时只更新滚动 release，所以磁盘占用不会一直涨。
      - name: 按需保留这个版本的 APK
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v1.0.7-diy.$CI_VERSION_CODE"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "tag $TAG 已存在"
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$TAG" -f "sha=$GITHUB_SHA" >/dev/null
            echo "已打 tag: $TAG"
          fi
          MSG=$(git log -1 --pretty=%s | tr -d '"')
          KEEP="${{ inputs.keep }}"
          # 标记必须出现在提交标题末尾：句子中间提到它不算（否则一条讲这个规则的 commit 会误存一份）
          if [ "$KEEP" != "true" ] && ! printf '%s' "$MSG" | grep -qE '\[keep\][[:space:]]*$'; then
            echo "本版本没有标记保留，跳过 APK 存档（以后想存：在这个 tag 上 Run workflow 并勾选保留）"
            exit 0
          fi
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK#app-debug.apk" --clobber
            echo "已更新 $TAG 的 APK"
          else
            {
              echo "$MSG"
              echo ""
              echo "#### 安卓（APK）"
              echo ""
              echo "- [app-debug.apk](https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/app-debug.apk)"
              echo ""
              echo "#### Windows（ZIP）"
              echo ""
              echo "- [SimulSub-1.0.7-windows-x64.zip](https://github.com/$GITHUB_REPOSITORY/releases/download/windows-latest/SimulSub-1.0.7-windows-x64.zip)（取同一时期构建的 Windows 包）"
            } > tag-notes.md
            gh release create "$TAG" "$APK#app-debug.apk" --title "$TAG" --notes-file tag-notes.md
            echo "已创建版本 release: $TAG"
          fi
          # 关键：把 latest 重新指回滚动 release，否则应用内更新会读到没有 update.json 的版本页
          gh release edit diy-latest --latest

      # ── 可选：要出签名 release 包时，在仓库 Secrets 配好下面四个再看这段 ──
      # - name: Sign release
      #   env:
      #     KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      #     KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      #     KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      #     KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      #   run: |
      #     ./gradlew :app:assembleRelease --no-daemon --stacktrace
      #     echo "$KEYSTORE_BASE64" | base64 -d > /tmp/release.jks
      #     BT=$(ls -d $ANDROID_HOME/build-tools/* | tail -1)
      #     $BT/zipalign -f 4 app/build/outputs/apk/release/*-unsigned.apk /tmp/aligned.apk
      #     $BT/apksigner sign --ks /tmp/release.jks --ks-pass pass:"$KEYSTORE_PASSWORD" \
      #       --ks-key-alias "$KEY_ALIAS" --key-pass pass:"$KEY_PASSWORD" \
      #       --out /tmp/app-release-signed.apk /tmp/aligned.apk
      #     cp /tmp/app-release-signed.apk app/build/outputs/apk/release/
