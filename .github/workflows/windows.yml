# The Windows zip (tools/win-app/build.sh) on a GitHub Windows runner, uploaded as the run's artifact.
# DIY: 跟着 main 一起构建，和安卓版同步出包；也可以手动触发。
name: windows
on:
  push:
    branches: [windows, main]
  workflow_dispatch:
jobs:
  zip:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '17'
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: actions/cache@v6
        with:
          path: |
            models
            tools/win-app/build/*.jar
          key: win-deps-v2-${{ hashFiles('setup.sh', 'tools/win-app/build.sh') }}
      - run: tools/win-app/build.sh
      - if: failure()
        run: cat desktop/build/compose/logs/*/*.txt || true
      # quick check of the helper: it must start, find an output device or say why, and exit
      - run: |
          R=tools/win-app/build/resources/windows-x64
          "$R/sysaudio.exe" 2 > /tmp/pcm 2> /tmp/err || true
          cat /tmp/err; ls -la /tmp/pcm
      # GitHub zips an artifact itself: upload the app folder, so the download unzips straight to SimulSub/ (the
      # Release's zip is the same folder, zipped once by tools/win-app/build.sh)
      - uses: actions/upload-artifact@v7
        with:
          name: SimulSub-windows-x64
          path: tools/win-app/build/zip/
