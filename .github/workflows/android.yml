      #     $BT/apksigner sign --ks /tmp/release.jks --ks-pass pass:"$KEYSTORE_PASSWORD" \
      #       --ks-key-alias "$KEY_ALIAS" --key-pass pass:"$KEY_PASSWORD" \
      #       --out /tmp/app-release-signed.apk /tmp/aligned.apk
      #     cp /tmp/app-release-signed.apk app/build/outputs/apk/release/
