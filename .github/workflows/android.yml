# Android APK 构建：手动触发或推送到 android 分支，产出可直装的 debug APK
#
# 用途：没有 PC 也能出包——手机上改代码 → push → 这里编译 → 下载 artifact。
# 放置位置：仓库根目录 .github/workflows/android.yml
name: android

on:
  push:
    branches: [android, main]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # 发布应用内更新需要写 release
    permissions:
      contents: write
    # versionCode 从 1000 起，避免和固定的 27 倒挂；App 内的更新器靠它判断「有新版本」
    env:
      CI_VERSION_CODE: ${{ 1000 + github.run_number }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      # setup.sh 从固定官方地址拉 sherpa-onnx AAR + 语音模型（约 78 MB），
      # 并做 SHA-256 校验；缓存 models/ 与 app/libs 避免每次重下。
      - uses: actions/cache@v6
        with:
          path: |
            models
            app/libs
          key: android-deps-${{ hashFiles('setup.sh') }}

      - name: Fetch models and native libs
        run: ./setup.sh

      # 固定 debug 签名：CI 每次跑在新 runner 上，不固定则每次构建签名都不同，
      # 覆盖安装会失败（INSTALL_FAILED_UPDATE_INCOMPATIBLE），App 里的配置和 key 也会丢。
      # 做法：仓库根目录的 .ci/debug.keystore 缓存复用，缺了就生成一把（app/build.gradle.kts 会用它）。
      - name: Restore debug keystore
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.ci/debug.keystore
          key: debug-keystore-v2

      - name: Ensure debug keystore
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.ci"
          KS="$GITHUB_WORKSPACE/.ci/debug.keystore"
          if [ -f "$KS" ]; then
            echo "keystore: 已从缓存恢复（签名固定）"
          else
            keytool -genkeypair -v -keystore "$KS" -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10950 \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "keystore: 首次生成，构建结束后会缓存"
          fi
          keytool -list -keystore "$KS" -storepass android | tail -2

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # 仓库里已有 gradlew，直接用它（不要用系统 gradle，版本可能不匹配）
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: SimulSub-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      # 应用内更新：发一个滚动的 release（tag 固定 diy-latest），APK 和 update.json 每次覆盖。
      # App 读 releases/latest/download/update.json，比对 versionCode，下载后校验 size + sha256 再装。
      - name: Publish in-app update release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          echo "APK: $APK"
          SIZE=$(stat -c%s "$APK")
          SHA=$(sha256sum "$APK" | awk '{print $1}')
          NAME="1.0.7-diy.$CI_VERSION_CODE"
          printf '{"versionCode":%s,"versionName":"%s","notes":"自动构建 #%s","apkUrl":"https://github.com/%s/releases/latest/download/app-debug.apk","size":%s,"sha256":"%s"}\n' \
            "$CI_VERSION_CODE" "$NAME" "$CI_VERSION_CODE" "$GITHUB_REPOSITORY" "$SIZE" "$SHA" > update.json
          cat update.json
          gh release view diy-latest >/dev/null 2>&1 \
            || gh release create diy-latest --title "DIY 最新构建" --notes "自动构建产物，供应用内更新使用" --latest
          gh release upload diy-latest "$APK#app-debug.apk" update.json --clobber
          gh release edit diy-latest --latest

      # ── 可选：要出签名 release 包时，在仓库 Secrets 配好下面四个再看这段 ──
      # - name: Sign release
      #   env:
      #     KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      #     KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      #     KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      #     KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      #   run: |
      #     ./gradlew :app:assembleRelease --no-daemon --stacktrace
      #     echo "$KEYSTORE_BASE64" | base64 -d > /tmp/release.jks
      #     BT=$(ls -d $ANDROID_HOME/build-tools/* | tail -1)
