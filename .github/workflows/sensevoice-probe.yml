# 一次性辅助工作流：确认 SenseVoice 模型在 HuggingFace 上的单文件地址可用（只发 HEAD，不下载）。
name: sensevoice-probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe HuggingFace file URLs
        run: |
          for base in \
            "https://huggingface.co/csukuangfj/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-2024-07-17/resolve/main" \
            "https://huggingface.co/csukuangfj/sense-voice/resolve/main" ; do
            for f in model.int8.onnx tokens.txt ; do
              code=$(curl -sIL -o /dev/null -w '%{http_code}' --max-time 40 "$base/$f" || echo ERR)
              len=$(curl -sIL -o /dev/null -w '%{size_download}' --max-time 40 "$base/$f" || echo 0)
              clen=$(curl -sIL --max-time 40 "$base/$f" | awk 'BEGIN{IGNORECASE=1} /^content-length:/{v=$2} END{gsub(/\r/,"",v); print v}')
              echo "$base/$f -> http=$code content-length=${clen:-?}"
            done
          done
