# Android APK 构建：手动触发或推送到 android 分支，产出可直装的 debug APK
#
# 用途：没有 PC 也能出包——手机上改代码 → push → 这里编译 → 下载 artifact。
# 放置位置：仓库根目录 .github/workflows/android.yml
name: android

on:
  push:
    branches: [android, main]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      # setup.sh 从固定官方地址拉 sherpa-onnx AAR + 语音模型（约 78 MB），
      # 并做 SHA-256 校验；缓存 models/ 与 app/libs 避免每次重下。
      - uses: actions/cache@v6
        with:
          path: |
            models
            app/libs
          key: android-deps-${{ hashFiles('setup.sh') }}

      - name: Fetch models and native libs
        run: ./setup.sh

      # 固定 debug 签名：CI 每次跑在新 runner 上，不固定则每次构建签名都不同，
      # 覆盖安装会失败（INSTALL_FAILED_UPDATE_INCOMPATIBLE），App 里的配置和 key 也会丢。
      # 缓存放在工作区：构建前装回 ~/.android，构建后再存回去，由 post-job 保存。
      - name: Restore debug keystore
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.ci/debug.keystore
          key: debug-keystore-v1

      - name: Install debug keystore
        run: |
          mkdir -p "$HOME/.android"
          if [ -f "$GITHUB_WORKSPACE/.ci/debug.keystore" ]; then
            cp "$GITHUB_WORKSPACE/.ci/debug.keystore" "$HOME/.android/debug.keystore"
            echo "keystore: 已从缓存恢复"
          else
            echo "keystore: 缓存里还没有，本次生成的会在构建后保存"
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # 仓库里已有 gradlew，直接用它（不要用系统 gradle，版本可能不匹配）
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: SimulSub-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      # 构建后用过的 keystore 存回工作区，交给 post-job 缓存；下次构建就能恢复同一把
      - name: Stash debug keystore
        if: always()
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.ci"
          if [ ! -f "$GITHUB_WORKSPACE/.ci/debug.keystore" ]; then
            found=$(find "$HOME/.android" "${ANDROID_SDK_ROOT:-/nonexistent}" -maxdepth 3 -name debug.keystore 2>/dev/null | head -1)
            echo "keystore 实际位置: ${found:-未找到}"
            if [ -n "$found" ]; then cp "$found" "$GITHUB_WORKSPACE/.ci/debug.keystore"; fi
          fi
          ls -l "$GITHUB_WORKSPACE/.ci" || true

      # ── 可选：要出签名 release 包时，在仓库 Secrets 配好下面四个再看这段 ──
      # - name: Sign release
      #   env:
      #     KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      #     KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      #     KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      #     KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      #   run: |
      #     ./gradlew :app:assembleRelease --no-daemon --stacktrace
      #     echo "$KEYSTORE_BASE64" | base64 -d > /tmp/release.jks
      #     BT=$(ls -d $ANDROID_HOME/build-tools/* | tail -1)
